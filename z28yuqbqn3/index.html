<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Raport</title>
<script>
// Odszyfrowanie (crypto.subtle) działa tylko po HTTPS; GitHub Pages projektu nie wymusza HTTPS.
if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
  location.replace('https://' + location.host + location.pathname + location.search + location.hash);
}
</script>
<style>
/* Strona z hasłem przed zaszyfrowanym raportem. Kolory jak w raporcie (szablon.html). */
:root{--bg:#f6f7f6;--surface:#fcfcfb;--ink:#0f1413;--ink-2:#4d5553;--line:#e1e4e2;--accent:#1f5f5b;--bad-t:#b42828;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f1111;--surface:#191b1b;--ink:#f4f5f4;--ink-2:#c3c7c4;--line:#2c2f2e;--accent:#7cc4bd;--bad-t:#ff7a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font-size:1.25rem;margin:0 0 4px}
p{margin:0 0 18px;color:var(--ink-2);font-size:.95rem}
label{display:block;font-size:.9rem;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.zap{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:.9rem;color:var(--ink-2)}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.blad{min-height:1.4em;margin:10px 0 0;color:var(--bad-t);font-size:.9rem}
</style>
</head>
<body>
<form id="f" autocomplete="on" hidden>
  <h1>Raport</h1>
  <p>Wpisz hasło, żeby otworzyć raport.</p>
  <label for="h">Hasło</label>
  <input type="password" id="h" name="password" autocomplete="current-password" required autofocus>
  <label class="zap"><input type="checkbox" id="z" checked> Zapamiętaj na tym urządzeniu</label>
  <button id="b" type="submit">Otwórz raport</button>
  <div class="blad" id="e" role="alert"></div>
</form>

const KLUCZ = 'raport_klucz_' + location.pathname;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const doB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const pamiec = {
  get: () => { try { return localStorage.getItem(KLUCZ); } catch (e) { return null; } },
  set: v => { try { localStorage.setItem(KLUCZ, v); } catch (e) {} },
  del: () => { try { localStorage.removeItem(KLUCZ); } catch (e) {} }
};

async function wyprowadz(haslo) {
  const baza = await crypto.subtle.importKey('raw', new TextEncoder().encode(haslo), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64(D.s), iterations: D.i}, baza, 256);
}

async function odszyfruj(surowy) {
  const klucz = await crypto.subtle.importKey('raw', surowy, 'AES-GCM', false, ['decrypt']);
  const dane = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(D.v)}, klucz, b64(D.c));
  const strumien = new Blob([dane]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(strumien).text();
}

function pokaz(html) {
  document.open();
  document.write(html);
  document.close();
}

const f = document.getElementById('f'), h = document.getElementById('h'),
      z = document.getElementById('z'), b = document.getElementById('b'), e = document.getElementById('e');

f.addEventListener('submit', async ev => {
  ev.preventDefault();
  e.textContent = '';
  b.disabled = true;
  b.textContent = 'Otwieram...';
  try {
    const surowy = await wyprowadz(h.value);
    const html = await odszyfruj(surowy);
    if (z.checked) pamiec.set(doB64(surowy)); else pamiec.del();
    pokaz(html);
  } catch (err) {
    e.textContent = (window.crypto && crypto.subtle && window.DecompressionStream)
      ? 'Nieprawidłowe hasło.'
      : 'Ta przeglądarka nie obsługuje odszyfrowania raportu. Otwórz go w aktualnym Chrome, Edge, Firefoksie albo Safari.';
    b.disabled = false;
    b.textContent = 'Otwórz raport';
    h.select();
  }
});

(async () => {
  const zapisany = pamiec.get();
  if (zapisany) {
    try { pokaz(await odszyfruj(b64(zapisany))); return; } catch (err) { pamiec.del(); }
  }
  f.hidden = false;
  h.focus();
})();
</script>
